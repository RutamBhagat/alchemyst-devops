services:
  inference:
    platform: linux/amd64
    image: alchemyst/inference:local
    build:
      context: ../..
      dockerfile: deploy/docker/inference.Dockerfile
    environment:
      III_URL: ${III_URL:-ws://10.10.1.11:49134}
      MODEL_DIR: /models/huggingface
    volumes:
      - hf-cache:/models/huggingface
    mem_limit: 768m
    memswap_limit: 768m
    restart: unless-stopped

volumes:
  hf-cache:
