name: Deploy OCI

on:
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: Git commit/tag to deploy or roll back to
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: oci-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    env:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
      TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
      TF_VAR_private_key: ${{ secrets.OCI_PRIVATE_KEY }}
      TF_VAR_region: ${{ secrets.OCI_REGION }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Verify CI for requested revision
        id: verify
        uses: actions/github-script@v8
        env:
          REQUESTED_REF: ${{ inputs.deploy_ref }}
        with:
          result-encoding: string
          script: |
            const verifyCI = require('./deploy/verify-ci.cjs');
            return await verifyCI({ github, context, ref: process.env.REQUESTED_REF });
      - name: Check out verified revision
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.verify.outputs.result }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm --prefix infra/pulumi ci
      - name: Read previous deployment
        id: previous
        continue-on-error: true
        uses: pulumi/actions@v7
        with:
          command: output
          pulumi-version: 3.259.0
          stack-name: ${{ vars.PULUMI_STACK || 'dev' }}
          work-dir: infra/pulumi/oci
      - name: Deploy exact revision
        id: deploy
        env:
          DEPLOY_REF: ${{ steps.verify.outputs.result }}
        uses: pulumi/actions@v7
        with:
          command: up
          pulumi-version: 3.259.0
          stack-name: ${{ vars.PULUMI_STACK || 'dev' }}
          work-dir: infra/pulumi/oci
          # CI uses API-key secrets, not a developer's browser session token.
          config-map: |
            oci:auth: {value: ApiKey, secret: false}
          refresh: true
          diff: true
      - name: Smoke test deployment
        id: smoke
        continue-on-error: true
        env:
          API_URL: ${{ steps.deploy.outputs.apiUrl }}
        run: |
          set -euo pipefail
          # Native builds and model download on a micro can take many minutes.
          READY_TIMEOUT=3600 python3 deploy/smoke-test.py

          host="${API_URL#http://}"
          host="${host%%/*}"
          host="${host%%:*}"
          if timeout 5 bash -c "</dev/tcp/$host/49134" 2>/dev/null; then
            echo 'load balancer unexpectedly exposes RPC port 49134' >&2
            exit 1
          fi
      - name: Roll back failed smoke test
        if: steps.smoke.outcome == 'failure' && steps.previous.outputs.deployedRef != '' && steps.previous.outputs.deployedRef != steps.verify.outputs.result
        env:
          DEPLOY_REF: ${{ steps.previous.outputs.deployedRef }}
        uses: pulumi/actions@v7
        with:
          command: up
          pulumi-version: 3.259.0
          stack-name: ${{ vars.PULUMI_STACK || 'dev' }}
          work-dir: infra/pulumi/oci
          config-map: |
            oci:auth: {value: ApiKey, secret: false}
          refresh: true
          diff: true
      - name: Fail after unsuccessful verification
        if: steps.smoke.outcome == 'failure'
        run: |
          echo 'Deployment smoke test failed; rollback was attempted when a previous deployedRef was available.' >&2
          exit 1
